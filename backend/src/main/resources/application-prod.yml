spring:
  data:
    mongodb:
      auto-index-creation: true
  main:
    banner-mode: off

logging:
  level:
    org.springframework.web: ERROR
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR

# Sentry
sentry:
  dsn: ${SENTRY_DSN:}

gmc:
  server:
    statistics:
      max-size: 200
      min-interval-seconds: 300
  security:
    permission-cache:
      ttl-millis: 300000
  cors:
    secure-cookies: true
