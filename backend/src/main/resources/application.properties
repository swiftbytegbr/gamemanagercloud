spring.profiles.active=local
gmc.backend.version=3.0.0-DEV
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/api-docs/ui
gmc.helpdesk.email.to=contact@swiftbyte.de
spring.jackson.mapper.accept-case-insensitive-properties=true
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
# E-mail: set GMC_MAIL_ENABLED=false to run without an SMTP server
gmc.mail.enabled=${GMC_MAIL_ENABLED:true}
management.health.mail.enabled=${GMC_MAIL_ENABLED:true}
# Default limits for new teams and users (0 = unlimited). Values set here override the stored defaults on startup;
# unset values keep the stored defaults, which can also be changed via the admin API.
gmc.limits.user-max-owned-teams=${GMC_LIMIT_USER_MAX_OWNED_TEAMS:}
gmc.limits.team-max-members=${GMC_LIMIT_TEAM_MAX_MEMBERS:}
gmc.limits.team-max-nodes=${GMC_LIMIT_TEAM_MAX_NODES:}
gmc.limits.team-max-servers=${GMC_LIMIT_TEAM_MAX_SERVERS:}
gmc.limits.server-max-backups=${GMC_LIMIT_SERVER_MAX_BACKUPS:}
gmc.limits.server-max-rcon-commands=${GMC_LIMIT_SERVER_MAX_RCON_COMMANDS:}
gmc.limits.server-statistics-max-size=${GMC_LIMIT_SERVER_STATISTICS_MAX_SIZE:}
gmc.limits.server-max-logs=${GMC_LIMIT_SERVER_MAX_LOGS:}
